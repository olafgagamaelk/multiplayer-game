<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplayer Arena</title>
<style>
/* ===== GLOBAL ===== */
* {
    box-sizing: border-box;
    user-select: none;
}
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a0a0a;
    color: #fff;
}
canvas {
    display: block;
    cursor: crosshair;
}

/* ===== UI OVERLAY ===== */
#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 100;
    display: flex;
    gap: 10px;
    align-items: center;
}
#nameInput {
    padding: 10px 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 30px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 15px;
    outline: none;
    backdrop-filter: blur(8px);
    transition: border 0.3s;
}
#nameInput:focus {
    border-color: #ffaa44;
}
#saveBtn {
    padding: 10px 20px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #ffaa44, #ff6600);
    color: #111;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,102,0,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
}
#saveBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,102,0,0.7);
}

/* ===== VÅBEN MENU ===== */
#weaponMenu {
    position: fixed;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 8px;
    z-index: 100;
    background: rgba(0,0,0,0.4);
    padding: 8px;
    border-radius: 40px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.weaponBtn {
    padding: 10px 16px;
    background: transparent;
    color: #ddd;
    border: 2px solid transparent;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    border-radius: 30px;
    transition: all 0.25s;
    letter-spacing: 0.5px;
}
.weaponBtn:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
}
.weaponBtn.active {
    background: linear-gradient(135deg, #ffaa44, #ff6600);
    border-color: #fff;
    color: #111;
    box-shadow: 0 0 20px rgba(255,102,0,0.6);
}

/* ===== LEADERBOARD ===== */
#leaderboard {
    position: fixed;
    top: 80px;
    left: 15px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 12px 16px;
    z-index: 90;
    min-width: 140px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
}
#leaderboard h3 {
    margin: 0 0 8px;
    font-size: 16px;
    text-align: center;
    color: #ffcc66;
    text-transform: uppercase;
    letter-spacing: 1px;
}
#lbList {
    list-style: none;
    padding: 0;
    margin: 0;
}
#lbList li {
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    background: rgba(255,255,255,0.05);
    margin-bottom: 4px;
    transition: background 0.2s;
}
#lbList li:hover {
    background: rgba(255,255,255,0.12);
}

/* ===== KILL FEED ===== */
#killFeed {
    position: fixed;
    right: 20px;
    top: 100px;
    z-index: 120;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.killMsg {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    animation: slideIn 0.3s ease-out, fadeOut 0.5s ease 3.5s forwards;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    border-left: 4px solid #ff3333;
}
@keyframes slideIn {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
@keyframes fadeOut {
    to { opacity: 0; transform: translateY(-20px); }
}

/* ===== HUD (ammo + reload) ===== */
#hud {
    position: fixed;
    bottom: 25px;
    left: 25px;
    z-index: 110;
    font-size: 28px;
    font-weight: 800;
    text-shadow: 3px 3px 0 #000;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 40px;
    backdrop-filter: blur(6px);
    letter-spacing: 1px;
}
#reloadBar {
    position: fixed;
    bottom: 75px;
    left: 25px;
    width: 160px;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
    display: none;
    z-index: 110;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
}
#reloadFill {
    height: 100%;
    background: linear-gradient(90deg, #ffcc44, #ff8800);
    border-radius: 10px;
    transition: width 0.1s linear;
    box-shadow: 0 0 10px #ff8800;
}

/* ===== SKADES OVERLAY ===== */
#damageOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,0.6) 100%);
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 50;
}
</style>
</head>
<body>

<div id="ui">
    <input id="nameInput" maxlength="12" placeholder="Dit navn">
    <button id="saveBtn">Gem navn</button>
</div>

<div id="weaponMenu">
    <button class="weaponBtn active" data-weapon="revolver">🔫 Revolver</button>
    <button class="weaponBtn" data-weapon="shotgun">💥 Shotgun</button>
    <button class="weaponBtn" data-weapon="sniper">🔭 Sniper</button>
    <button class="weaponBtn" data-weapon="ak47">🔫 AK-47</button>
</div>

<div id="leaderboard">
    <h3>🏆 Top spillere</h3>
    <ol id="lbList"></ol>
</div>

<div id="killFeed"></div>
<div id="damageOverlay"></div>
<div id="hud">🔫 <span id="ammoDisplay">6/6</span></div>
<div id="reloadBar"><div id="reloadFill"></div></div>
<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>

// ===================== AUDIO SYSTEM =====================
let audioCtx = null;
function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    switch(type) {
        case 'shoot': {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
            break;
        }
        case 'hit': {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
            break;
        }
        case 'reload': {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
            break;
        }
        case 'kill': {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
            break;
        }
    }
}

// ===================== SPIL VARIABLER =====================
const socket = io();
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const damageOverlay = document.getElementById('damageOverlay');
const ammoDisplay = document.getElementById('ammoDisplay');
const reloadBar = document.getElementById('reloadBar');
const reloadFill = document.getElementById('reloadFill');
const lbList = document.getElementById('lbList');
const killFeed = document.getElementById('killFeed');
const weaponBtns = document.querySelectorAll('.weaponBtn');

let myId = null;
let players = {};
let renderPlayers = {};
let bullets = [];

const MAP_WIDTH = 1400;
const MAP_HEIGHT = 900;
const PLAYER_SIZE = 30;
const SPEED = 2.6;

// Vægge (samme som server)
const walls = [
    {x:120,y:120,w:220,h:40,r:20},
    {x:450,y:90,w:180,h:40,r:-25},
    {x:850,y:130,w:240,h:40,r:15},
    {x:180,y:300,w:40,h:220,r:35},
    {x:500,y:260,w:280,h:40,r:-15},
    {x:980,y:250,w:40,h:240,r:10},
    {x:250,y:600,w:220,h:40,r:30},
    {x:650,y:540,w:40,h:220,r:-20},
    {x:900,y:650,w:260,h:40,r:12},
    {x:1080,y:430,w:180,h:40,r:-35},
    {x:320,y:430,w:160,h:40,r:45},
    {x:730,y:350,w:170,h:40,r:-40}
];

// Dekorationer (flere og varierede)
const decorations = [];
function generateDecorations() {
    const types = ['bush', 'rock', 'flower', 'tree'];
    for (let i = 0; i < 40; i++) {
        const x = Math.random() * MAP_WIDTH;
        const y = Math.random() * MAP_HEIGHT;
        let type = types[Math.floor(Math.random() * types.length)];
        let size = 5 + Math.random() * 15;
        // Undgå at placere oven på vægge
        let overlapping = false;
        for (const wall of walls) {
            const cx = wall.x + wall.w/2;
            const cy = wall.y + wall.h/2;
            const rad = -wall.r * Math.PI / 180;
            const dx = x - cx;
            const dy = y - cy;
            const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
            const localY = dx * Math.sin(rad) + dy * Math.cos(rad);
            if (Math.abs(localX) < wall.w/2 + size && Math.abs(localY) < wall.h/2 + size) {
                overlapping = true;
                break;
            }
        }
        if (!overlapping) {
            decorations.push({x, y, type, size});
        }
    }
}
generateDecorations();

const me = { x: 700, y: 450 };

let camX = 0, camY = 0;
let recoilX = 0, recoilY = 0;
let shakeX = 0, shakeY = 0;
let particles = [];

const keys = {};
let lastSend = 0;
let lastShoot = 0;

// Våbensystem
const weapons = {
    revolver: { magSize: 6, reloadTime: 1500, shootCooldown: 200 },
    shotgun: { magSize: 2, reloadTime: 2000, shootCooldown: 800 },
    sniper: { magSize: 1, reloadTime: 1800, shootCooldown: 900 },
    ak47: { magSize: 10, reloadTime: 2200, shootCooldown: 120 },
    secret: { magSize: Infinity, reloadTime: 0, shootCooldown: 0 }
};

let currentWeapon = 'revolver';
let magazine = weapons.revolver.magSize;
let isReloading = false;
let reloadStart = 0;
let isBubber = false;

// ===================== HJÆLPEFUNKTIONER =====================
function lerp(a,b,t){ return a + (b-a)*t; }

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ===================== UI OPSÆTNING =====================
weaponBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        if (isBubber) return;
        if (isReloading) return;
        const weapon = btn.dataset.weapon;
        if (weapon === currentWeapon) return;
        weaponBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentWeapon = weapon;
        magazine = weapons[weapon].magSize;
        isReloading = false;
        reloadBar.style.display = 'none';
        updateAmmoDisplay();
        socket.emit('changeWeapon', weapon);
        playSound('reload');
    });
});

function updateAmmoDisplay() {
    const w = weapons[currentWeapon];
    ammoDisplay.textContent = w.magSize === Infinity ? '∞' : `${magazine}/${w.magSize}`;
}

// ===================== NETVÆRK =====================
socket.on('id', id => myId = id);

socket.on('secretUnlocked', () => {
    isBubber = true;
    currentWeapon = 'secret';
    magazine = Infinity;
    updateAmmoDisplay();
    weaponBtns.forEach(b => b.style.display = 'none');
});

socket.on('state', data => {
    players = data.players || {};
    bullets = data.bullets || [];

    for (const id in players) {
        if (!renderPlayers[id]) {
            renderPlayers[id] = { x: players[id].x, y: players[id].y };
        }
    }

    if (myId && players[myId]) {
        const serverMe = players[myId];
        const dx = serverMe.x - me.x;
        const dy = serverMe.y - me.y;
        if (Math.sqrt(dx*dx+dy*dy) > 80) {
            me.x = serverMe.x;
            me.y = serverMe.y;
        }
        players[myId].x = me.x;
        players[myId].y = me.y;
    }
    updateLeaderboard();
});

socket.on('bulletHit', events => {
    for (const ev of events) {
        if (ev.type === 'player') {
            for (let i=0;i<18;i++) {
                const angle = Math.random()*Math.PI*2;
                const speed = 2+Math.random()*6;
                particles.push({
                    x: ev.x, y: ev.y,
                    vx: Math.cos(angle)*speed,
                    vy: Math.sin(angle)*speed,
                    life: 30+Math.random()*25,
                    maxLife: 55,
                    color: `hsl(${Math.random()*30+350}, 100%, ${50+Math.random()*30}%)`,
                    size: 2+Math.random()*5
                });
            }
            playSound('hit');
        } else if (ev.type === 'wall') {
            for (let i=0;i<10;i++) {
                const angle = Math.random()*Math.PI*2;
                const speed = 1+Math.random()*5;
                particles.push({
                    x: ev.x, y: ev.y,
                    vx: Math.cos(angle)*speed,
                    vy: Math.sin(angle)*speed,
                    life: 15+Math.random()*15,
                    maxLife: 30,
                    color: `hsl(${Math.random()*20+40}, 100%, ${60+Math.random()*40}%)`,
                    size: 1.5+Math.random()*3
                });
            }
        }
    }
});

socket.on('damaged', data => {
    damageOverlay.style.opacity = '1';
    setTimeout(()=>{ damageOverlay.style.opacity = '0'; }, 120);
    shakeX = (Math.random()-0.5)*25;
    shakeY = (Math.random()-0.5)*25;
});

socket.on('killFeed', data => {
    const msg = document.createElement('div');
    msg.className = 'killMsg';
    msg.textContent = `${data.killer} 🔫 ${data.victim}`;
    killFeed.appendChild(msg);
    setTimeout(() => msg.remove(), 4000);
    playSound('kill');
});

function updateLeaderboard() {
    const arr = Object.values(players);
    arr.sort((a,b) => (b.kills||0) - (a.kills||0));
    const top = arr.slice(0, 5);
    lbList.innerHTML = '';
    top.forEach((p, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${idx+1}. ${p.name}</span><span>${p.kills||0} kills</span>`;
        lbList.appendChild(li);
    });
}

// ===================== INPUT =====================
document.getElementById('saveBtn').addEventListener('click', () => {
    socket.emit('name', document.getElementById('nameInput').value);
    initAudio();
});

document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'r' && !isReloading && weapons[currentWeapon].magSize !== Infinity && magazine < weapons[currentWeapon].magSize) {
        startReload();
    }
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function startReload() {
    if (weapons[currentWeapon].magSize === Infinity) return;
    isReloading = true;
    reloadStart = Date.now();
    reloadBar.style.display = 'block';
    reloadFill.style.width = '0%';
    playSound('reload');
}

function finishReload() {
    magazine = weapons[currentWeapon].magSize;
    isReloading = false;
    reloadBar.style.display = 'none';
    updateAmmoDisplay();
}

function updateReload() {
    if (isReloading) {
        const elapsed = Date.now() - reloadStart;
        const reloadTime = weapons[currentWeapon].reloadTime;
        const progress = Math.min(elapsed / reloadTime, 1);
        reloadFill.style.width = (progress*100) + '%';
        if (elapsed >= reloadTime) finishReload();
    }
}

// ===================== SKYDNING =====================
canvas.addEventListener('mousedown', e => {
    initAudio();
    const w = weapons[currentWeapon];
    if (w.shootCooldown > 0 && Date.now() - lastShoot < w.shootCooldown) return;
    if (isReloading) return;
    if (magazine <= 0 && w.magSize !== Infinity) return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    const worldMX = mouseX + camX;
    const worldMY = mouseY + camY;
    const centerX = me.x + PLAYER_SIZE/2;
    const centerY = me.y + PLAYER_SIZE/2;
    const angle = Math.atan2(worldMY - centerY, worldMX - centerX);

    socket.emit('shoot', { angle, weapon: currentWeapon });
    playSound('shoot');

    if (w.magSize !== Infinity) magazine--;
    lastShoot = Date.now();
    updateAmmoDisplay();

    const recoilPower = currentWeapon === 'shotgun' ? 14 : currentWeapon === 'sniper' ? 18 : currentWeapon === 'ak47' ? 4 : currentWeapon === 'secret' ? 1 : 8;
    recoilX -= Math.cos(angle) * recoilPower;
    recoilY -= Math.sin(angle) * recoilPower;

    shakeX = (Math.random()-0.5) * (currentWeapon === 'sniper' ? 30 : 16);
    shakeY = (Math.random()-0.5) * (currentWeapon === 'sniper' ? 30 : 16);

    const pushBack = currentWeapon === 'shotgun' ? 5 : currentWeapon === 'sniper' ? 6 : currentWeapon === 'ak47' ? 1.5 : currentWeapon === 'secret' ? 0.5 : 3;
    me.x -= Math.cos(angle) * pushBack;
    me.y -= Math.sin(angle) * pushBack;
    me.x = Math.max(0, Math.min(MAP_WIDTH - PLAYER_SIZE, me.x));
    me.y = Math.max(0, Math.min(MAP_HEIGHT - PLAYER_SIZE, me.y));

    const muzzleX = centerX + Math.cos(angle)*16;
    const muzzleY = centerY + Math.sin(angle)*16;
    const particleCount = currentWeapon === 'shotgun' ? 12 : 6;
    for (let i=0;i<particleCount;i++) {
        const spread = (Math.random()-0.5)*0.6;
        particles.push({
            x: muzzleX, y: muzzleY,
            vx: Math.cos(angle+spread)*4,
            vy: Math.sin(angle+spread)*4,
            life: 6,
            maxLife: 6,
            color: 'orange',
            size: 3+Math.random()*4
        });
    }

    if (magazine <= 0 && w.magSize !== Infinity && !isReloading) {
        startReload();
    }
});

// ===================== KOLLISION =====================
function pointInRotatedRect(px, py, wall) {
    const cx = wall.x + wall.w/2;
    const cy = wall.y + wall.h/2;
    const rad = -wall.r * Math.PI / 180;
    const dx = px - cx;
    const dy = py - cy;
    const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
    const localY = dx * Math.sin(rad) + dy * Math.cos(rad);
    return (localX > -wall.w/2 && localX < wall.w/2 && localY > -wall.h/2 && localY < wall.h/2);
}

function pushOutOfWall(px, py, wall) {
    const cx = wall.x + wall.w/2;
    const cy = wall.y + wall.h/2;
    const rad = -wall.r * Math.PI / 180;
    const dx = px - cx;
    const dy = py - cy;
    const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
    const localY = dx * Math.sin(rad) + dy * Math.cos(rad);
    const halfW = wall.w/2;
    const halfH = wall.h/2;
    if (Math.abs(localX) <= halfW && Math.abs(localY) <= halfH) {
        const distLeft = halfW + localX;
        const distRight = halfW - localX;
        const distTop = halfH + localY;
        const distBottom = halfH - localY;
        let pushLocal = { x: 0, y: 0 };
        const minDist = Math.min(distLeft, distRight, distTop, distBottom);
        if (minDist === distLeft) pushLocal.x = -distLeft - 0.1;
        else if (minDist === distRight) pushLocal.x = distRight + 0.1;
        else if (minDist === distTop) pushLocal.y = -distTop - 0.1;
        else if (minDist === distBottom) pushLocal.y = distBottom + 0.1;
        const angle = -rad;
        return {
            dx: pushLocal.x * Math.cos(angle) - pushLocal.y * Math.sin(angle),
            dy: pushLocal.x * Math.sin(angle) + pushLocal.y * Math.cos(angle)
        };
    }
    return null;
}

function resolveCollisions() {
    const corners = [
        [me.x, me.y],
        [me.x + PLAYER_SIZE, me.y],
        [me.x, me.y + PLAYER_SIZE],
        [me.x + PLAYER_SIZE, me.y + PLAYER_SIZE]
    ];
    for (const wall of walls) {
        for (let i=0;i<4;i++) {
            const cx = corners[i][0], cy = corners[i][1];
            if (pointInRotatedRect(cx, cy, wall)) {
                const push = pushOutOfWall(cx, cy, wall);
                if (push) {
                    me.x += push.dx;
                    me.y += push.dy;
                    corners[0][0] = me.x; corners[0][1] = me.y;
                    corners[1][0] = me.x + PLAYER_SIZE; corners[1][1] = me.y;
                    corners[2][0] = me.x; corners[2][1] = me.y + PLAYER_SIZE;
                    corners[3][0] = me.x + PLAYER_SIZE; corners[3][1] = me.y + PLAYER_SIZE;
                }
            }
        }
    }
}

function movePlayer(dx, dy) {
    me.x += dx;
    me.y += dy;
    resolveCollisions();
    me.x = Math.max(0, Math.min(MAP_WIDTH - PLAYER_SIZE, me.x));
    me.y = Math.max(0, Math.min(MAP_HEIGHT - PLAYER_SIZE, me.y));
}

// ===================== UPDATE =====================
function update() {
    let moved = false;
    if (keys['w']) { movePlayer(0,-SPEED); moved = true; }
    if (keys['s']) { movePlayer(0, SPEED); moved = true; }
    if (keys['a']) { movePlayer(-SPEED,0); moved = true; }
    if (keys['d']) { movePlayer( SPEED,0); moved = true; }

    if (moved && Date.now() - lastSend > 50) {
        socket.emit('move', { x: me.x, y: me.y });
        lastSend = Date.now();
    }

    recoilX = lerp(recoilX, 0, 0.15);
    recoilY = lerp(recoilY, 0, 0.15);
    shakeX = lerp(shakeX, 0, 0.15);
    shakeY = lerp(shakeY, 0, 0.15);

    const targetCamX = me.x - canvas.width/2 + PLAYER_SIZE/2 + recoilX + shakeX;
    const targetCamY = me.y - canvas.height/2 + PLAYER_SIZE/2 + recoilY + shakeY;
    camX = lerp(camX, targetCamX, 0.08);
    camY = lerp(camY, targetCamY, 0.08);

    updateReload();

    for (let i=particles.length-1;i>=0;i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i,1);
    }
}

// ===================== TEGNING =====================
function drawBackground() {
    // Gradient baggrund
    const grad = ctx.createLinearGradient(-camX, -camY, -camX + MAP_WIDTH, -camY + MAP_HEIGHT);
    grad.addColorStop(0, '#1a3a1a');
    grad.addColorStop(0.5, '#2d5a2d');
    grad.addColorStop(1, '#1a3a1a');
    ctx.fillStyle = grad;
    ctx.fillRect(-camX, -camY, MAP_WIDTH, MAP_HEIGHT);

    // Grid (subtil)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    const startX = Math.floor(-camX / gridSize) * gridSize;
    const startY = Math.floor(-camY / gridSize) * gridSize;
    for (let x = startX; x < -camX + MAP_WIDTH; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, -camY);
        ctx.lineTo(x, -camY + MAP_HEIGHT);
        ctx.stroke();
    }
    for (let y = startY; y < -camY + MAP_HEIGHT; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(-camX, y);
        ctx.lineTo(-camX + MAP_WIDTH, y);
        ctx.stroke();
    }
}

function drawGrass() {
    // Græstekstur som før men finere
    ctx.fillStyle = 'rgba(60,120,60,0.6)';
    for (let x = -camX; x < -camX + MAP_WIDTH; x += 8) {
        for (let y = -camY; y < -camY + MAP_HEIGHT; y += 8) {
            if ((x + y) % 16 === 0) {
                ctx.fillRect(x, y, 2, 2);
            }
        }
    }
}

function drawWalls() {
    for (const wall of walls) {
        // Skygge
        ctx.save();
        ctx.translate(wall.x + wall.w/2 - camX + 5, wall.y + wall.h/2 - camY + 5);
        ctx.rotate(wall.r * Math.PI / 180);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(-wall.w/2, -wall.h/2, wall.w, wall.h);
        ctx.restore();

        // Selve væggen med gradient
        ctx.save();
        ctx.translate(wall.x + wall.w/2 - camX, wall.y + wall.h/2 - camY);
        ctx.rotate(wall.r * Math.PI / 180);

        const grad = ctx.createLinearGradient(-wall.w/2, 0, wall.w/2, 0);
        grad.addColorStop(0, '#6b6b6b');
        grad.addColorStop(0.5, '#8a8a8a');
        grad.addColorStop(1, '#6b6b6b');
        ctx.fillStyle = grad;
        ctx.fillRect(-wall.w/2, -wall.h/2, wall.w, wall.h);

        // Murstensmønster
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        const brickW = 14, brickH = 8;
        const seed = wall.x * 31 + wall.y * 17;
        for (let bx = -wall.w/2; bx < wall.w/2; bx += brickW + 2) {
            for (let by = -wall.h/2; by < wall.h/2; by += brickH + 2) {
                const w = brickW * (0.5 + ((bx*7 + by*13 + seed) % 10) / 25);
                const h = brickH * (0.5 + ((bx*3 + by*11 + seed) % 10) / 25);
                ctx.fillRect(bx, by, w, h);
            }
        }

        // Kant
        ctx.strokeStyle = '#3a3a3a';
        ctx.lineWidth = 2;
        ctx.strokeRect(-wall.w/2, -wall.h/2, wall.w, wall.h);
        ctx.restore();
    }
}

function drawDecorations() {
    for (const d of decorations) {
        const sx = d.x - camX;
        const sy = d.y - camY;
        // Skygge
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        if (d.type === 'bush' || d.type === 'flower') {
            ctx.arc(sx+2, sy+3, d.size, 0, Math.PI*2);
        } else if (d.type === 'tree') {
            ctx.fillRect(sx-d.size/2+2, sy-d.size/2+3, d.size, d.size);
        } else {
            ctx.fillRect(sx-d.size/2+2, sy-d.size/2+3, d.size, d.size);
        }
        ctx.fill();

        // Selve objektet
        if (d.type === 'bush') {
            ctx.fillStyle = '#2d5a1e';
            ctx.beginPath();
            ctx.arc(sx, sy, d.size, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#3f7a2d';
            for (let i=0;i<4;i++) {
                const angle = Math.random()*Math.PI*2;
                const dist = Math.random()*d.size*0.5;
                ctx.beginPath();
                ctx.arc(sx+Math.cos(angle)*dist, sy+Math.sin(angle)*dist, d.size/3, 0, Math.PI*2);
                ctx.fill();
            }
        } else if (d.type === 'rock') {
            const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, d.size);
            grad.addColorStop(0, '#888');
            grad.addColorStop(1, '#444');
            ctx.fillStyle = grad;
            ctx.fillRect(sx-d.size/2, sy-d.size/2, d.size, d.size);
        } else if (d.type === 'flower') {
            ctx.fillStyle = '#ff69b4';
            for (let i=0;i<5;i++) {
                const angle = i * Math.PI*2/5;
                ctx.beginPath();
                ctx.arc(sx+Math.cos(angle)*4, sy+Math.sin(angle)*4, 3, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.fillStyle = '#ffdd44';
            ctx.beginPath();
            ctx.arc(sx, sy, 2, 0, Math.PI*2);
            ctx.fill();
        } else if (d.type === 'tree') {
            // Stamme
            ctx.fillStyle = '#5a3d2a';
            ctx.fillRect(sx-2, sy-5, 4, 10);
            // Krone
            ctx.fillStyle = '#1e4d1e';
            ctx.beginPath();
            ctx.arc(sx, sy-8, d.size, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#2d6b2d';
            ctx.beginPath();
            ctx.arc(sx-3, sy-12, d.size*0.6, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

function drawBullets() {
    for (const b of bullets) {
        // Skygge
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.arc(b.x-camX+2, b.y-camY+2, 5, 0, Math.PI*2);
        ctx.fill();
        // Glød
        ctx.shadowColor = 'orange';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(b.x-camX, b.y-camY, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
    }
}

function drawParticles() {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x-camX, p.y-camY, p.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawHealthBar(p, sx, sy) {
    if (typeof p.hp !== 'number') return;
    const hp = Math.max(0, p.hp);
    const w = PLAYER_SIZE;
    const h = 5;
    const x = sx;
    const y = sy - 10;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x, y, w, h);
    const fill = (hp/100)*w;
    const grad = ctx.createLinearGradient(x, y, x+w, y);
    grad.addColorStop(0, '#ff4444');
    grad.addColorStop(0.5, '#ffaa44');
    grad.addColorStop(1, '#44ff44');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, fill, h);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
}

function drawPlayerShadow(sx, sy) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(sx+PLAYER_SIZE/2, sy+PLAYER_SIZE+2, PLAYER_SIZE/2, PLAYER_SIZE/4, 0, 0, Math.PI*2);
    ctx.fill();
}

// Våbenmodeller (forbedrede)
function drawRevolverModel() {
    ctx.fillStyle = '#444'; ctx.fillRect(6, -2, 16, 4);
    ctx.fillStyle = '#777'; ctx.fillRect(20, -1.5, 3, 3);
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.ellipse(2, 0, 7, 5, 0, 0, Math.PI*2); ctx.fill();
    for(let i=0;i<6;i++){ const a=i*Math.PI/3; ctx.fillStyle='#555'; ctx.beginPath(); ctx.arc(2+Math.cos(a)*4.5,Math.sin(a)*3.2,1.2,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#5c3d2e'; ctx.beginPath(); ctx.moveTo(-4,2); ctx.lineTo(-10,14); ctx.lineTo(-6,16); ctx.lineTo(-1,5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(4,10); ctx.lineTo(2,10); ctx.stroke();
}
function drawShotgunModel() {
    ctx.fillStyle = '#555'; ctx.fillRect(6, -3, 20, 2.5); ctx.fillRect(6, 0.5, 20, 2.5);
    ctx.fillStyle = '#5a4320'; ctx.beginPath(); ctx.moveTo(-2,2); ctx.lineTo(-12,12); ctx.lineTo(-8,14); ctx.lineTo(0,5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5c3d2e'; ctx.beginPath(); ctx.moveTo(4,-4); ctx.lineTo(4,-14); ctx.lineTo(6,-14); ctx.lineTo(6,-4); ctx.closePath(); ctx.fill();
}
function drawSniperModel() {
    ctx.fillStyle = '#333'; ctx.fillRect(6, -2, 24, 4);
    ctx.fillStyle = '#666'; ctx.fillRect(26, -1.5, 4, 3);
    ctx.fillStyle = '#222'; ctx.fillRect(10, -6, 14, 3);
    ctx.fillStyle = '#4a3320'; ctx.beginPath(); ctx.moveTo(-4,2); ctx.lineTo(-16,14); ctx.lineTo(-12,16); ctx.lineTo(-2,5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-8,10); ctx.lineTo(-10,20); ctx.moveTo(-4,11); ctx.lineTo(-6,20); ctx.stroke();
}
function drawAKModel() {
    ctx.fillStyle = '#3a3a3a'; ctx.fillRect(6, -2, 18, 4);
    ctx.fillStyle = '#555'; ctx.fillRect(22, -1.5, 3, 3);
    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(4, 2, 8, 10);
    ctx.fillStyle = '#5a3d2a'; ctx.beginPath(); ctx.moveTo(-4,2); ctx.lineTo(-14,10); ctx.lineTo(-10,12); ctx.lineTo(-2,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(12, -5, 6, 2);
}
function drawSecretModel() {
    ctx.fillStyle = '#c0c0c0'; ctx.fillRect(6, -1.5, 12, 3);
    ctx.fillStyle = '#888'; ctx.fillRect(16, -1, 3, 2);
    ctx.fillStyle = '#4a4a4a'; ctx.beginPath(); ctx.moveTo(-3,1.5); ctx.lineTo(-8,12); ctx.lineTo(-5,13); ctx.lineTo(0,3); ctx.closePath(); ctx.fill();
}

function drawWeapon(weapon, cx, cy, angle) {
    ctx.save();
    ctx.translate(cx, cy);
    if (Math.cos(angle) < 0) {
        ctx.scale(-1, 1);
        ctx.rotate(Math.PI - angle);
    } else {
        ctx.rotate(angle);
    }
    switch(weapon) {
        case 'revolver': drawRevolverModel(); break;
        case 'shotgun': drawShotgunModel(); break;
        case 'sniper': drawSniperModel(); break;
        case 'ak47': drawAKModel(); break;
        case 'secret': drawSecretModel(); break;
    }
    ctx.restore();
}

function drawVignette() {
    const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width*0.4, canvas.width/2, canvas.height/2, canvas.width*0.9);
    gradient.addColorStop(0, 'rgba(0,0,0,0)');
    gradient.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawGrass();
    drawDecorations();
    drawWalls();
    drawBullets();
    drawParticles();

    // Andre spillere
    for (const id in players) {
        if (id === myId) continue;
        const p = players[id];
        const rp = renderPlayers[id];
        if (!rp) continue;
        rp.x = lerp(rp.x, p.x, 0.2);
        rp.y = lerp(rp.y, p.y, 0.2);
        const sx = rp.x - camX;
        const sy = rp.y - camY;
        drawPlayerShadow(sx, sy);
        // Krop med gradient
        const bodyGrad = ctx.createLinearGradient(sx, sy, sx, sy+PLAYER_SIZE);
        bodyGrad.addColorStop(0, '#5a9eff');
        bodyGrad.addColorStop(1, '#2a5aff');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.roundRect(sx, sy, PLAYER_SIZE, PLAYER_SIZE, 6);
        ctx.fill();
        // Øjne
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx+10, sy+10, 3, 0, Math.PI*2);
        ctx.arc(sx+20, sy+10, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(sx+10, sy+10, 1.5, 0, Math.PI*2);
        ctx.arc(sx+20, sy+10, 1.5, 0, Math.PI*2);
        ctx.fill();
        // Våben
        if (typeof p.aimAngle === 'number' && p.weapon) {
            const cx = rp.x + PLAYER_SIZE/2;
            const cy = rp.y + PLAYER_SIZE/2;
            drawWeapon(p.weapon, cx - camX, cy - camY, p.aimAngle);
        }
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText(p.name || 'Player', sx + 15, sy - 18);
        drawHealthBar(p, sx, sy);
    }

    // Mig selv
    const myScreenX = me.x - camX;
    const myScreenY = me.y - camY;
    drawPlayerShadow(myScreenX, myScreenY);
    const myGrad = ctx.createLinearGradient(myScreenX, myScreenY, myScreenX, myScreenY+PLAYER_SIZE);
    myGrad.addColorStop(0, '#ff6a6a');
    myGrad.addColorStop(1, '#cc2222');
    ctx.fillStyle = myGrad;
    ctx.beginPath();
    ctx.roundRect(myScreenX, myScreenY, PLAYER_SIZE, PLAYER_SIZE, 6);
    ctx.fill();
    // Øjne
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(myScreenX+10, myScreenY+10, 3, 0, Math.PI*2);
    ctx.arc(myScreenX+20, myScreenY+10, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(myScreenX+10, myScreenY+10, 1.5, 0, Math.PI*2);
    ctx.arc(myScreenX+20, myScreenY+10, 1.5, 0, Math.PI*2);
    ctx.fill();
    // Våben
    if (keys._mouseX && keys._mouseY) {
        const worldMX = keys._mouseX + camX;
        const worldMY = keys._mouseY + camY;
        const centerX = me.x + PLAYER_SIZE/2;
        const centerY = me.y + PLAYER_SIZE/2;
        const aimAngle = Math.atan2(worldMY - centerY, worldMX - centerX);
        drawWeapon(currentWeapon, centerX - camX, centerY - camY, aimAngle);
    }
    if (players[myId]) {
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText(players[myId].name || 'Player', myScreenX + 15, myScreenY - 18);
        drawHealthBar(players[myId], myScreenX, myScreenY);
    }

    drawVignette();
}

// roundRect polyfill for ældre browsere
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (r > w/2) r = w/2;
        if (r > h/2) r = h/2;
        this.moveTo(x+r, y);
        this.lineTo(x+w-r, y);
        this.quadraticCurveTo(x+w, y, x+w, y+r);
        this.lineTo(x+w, y+h-r);
        this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
        this.lineTo(x+r, y+h);
        this.quadraticCurveTo(x, y+h, x, y+h-r);
        this.lineTo(x, y+r);
        this.quadraticCurveTo(x, y, x+r, y);
        return this;
    };
}

// Mus tracking
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    keys._mouseX = e.clientX - rect.left;
    keys._mouseY = e.clientY - rect.top;
});

// Main loop
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
